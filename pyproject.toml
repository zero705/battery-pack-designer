[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-pack-designer"
version = "0.1.0"
description = "Size and analyse series/parallel lithium-ion battery packs from cell datasheet values."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ömer Faruk Şenol" }]
keywords = ["battery", "battery-pack", "bms", "lithium-ion", "electric-vehicle", "engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "matplotlib>=3.8"]

[project.scripts]
packdesign = "packdesign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
packdesign = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["packdesign"]
branch = true
# __main__ is exercised in a subprocess (tests/test_cli.py), which coverage does not trace.
omit = ["*/packdesign/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
# Runs on the newest Python (numpy's stubs need 3.12+ syntax); ruff's py310 target and
# the CI test matrix guard compatibility with Python 3.10.
strict = true
mypy_path = "src"
files = ["src", "tests"]
